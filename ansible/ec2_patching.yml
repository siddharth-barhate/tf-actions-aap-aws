- name: Setup Vault SSH certificate
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Show incoming vm_hosts
      debug:
        msg:
          - "vm_hosts type={{ vm_hosts | default(None) | type_debug }}"
          - "vm_hosts={{ vm_hosts | default('UNDEFINED') }}"

    - name: Show all variables (optional)
      debug:
        var: vars
    - name: Fail if vm_hosts is missing
      assert:
        that:
          - vm_hosts is defined
          - vm_hosts | string | length > 0
        fail_msg: "vm_hosts was not passed."
    - name: Normalize vm_hosts into a dictionary
      set_fact:
        vm_hosts_normalized: >-
          {% if vm_hosts is mapping %}
          {{ vm_hosts }}
          {% elif vm_hosts is string %}
          {{ (vm_hosts | from_json) if (vm_hosts | trim | regex_search('^\\s*[{\\[]')) else {} }}
          {% elif vm_hosts is sequence %}
          {{ dict((vm_hosts | list) | zip(vm_hosts | list)) }}
          {% else %}
          {{}}
          {% endif %}

    - name: Fail if vm_hosts_normalized is empty
      assert:
        that:
          - vm_hosts_normalized | length > 0
        fail_msg: "No valid hosts found in vm_hosts. Pass a dict or JSON dict, e.g. {'vm1':'10.0.1.10'}."

    - name: Add VMs to dynamic inventory
      add_host:
        name: "{{ item.key }}"
        groups: ec2_vms
        ansible_host: "{{ item.value }}"
        ansible_user: "{{ ansible_user | default('ubuntu') }}"
      loop: "{{ vm_hosts_normalized | dict2items }}"

    - name: Fail early if dynamic group is empty
      assert:
        that:
          - (groups['ec2_vms'] | default([]) | length) > 0
        fail_msg: "No hosts were added to ec2_vms."



- name: Patch AWS Ubuntu VMs
  hosts: ec2_vms
  remote_user: "{{ ansible_user | default('ubuntu') }}"
  become: yes
  become_method: sudo
  gather_facts: no

  vars:
    apt_cache_valid_time: 3600
    reboot_timeout: 600
    patch_type: "{{ patch_type_input | default('security') }}"
    reboot_allowed: "{{ reboot_allowed_input | default(false) }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=30
      -o ServerAliveInterval=10
      -o ServerAliveCountMax=6
    ansible_become_exe: /usr/bin/sudo
    ansible_become_flags: "-H -S -n"

  pre_tasks:
    - name: Wait for SSH port to be open
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 300
        delay: 5
        state: started
      delegate_to: localhost
      become: no

    - name: Wait for SSH connection to be usable
      wait_for_connection:
        connect_timeout: 20
        timeout: 300
        delay: 5
        sleep: 10

    - name: Gather facts
      setup:

    - name: Debug connection info
      debug:
        msg:
          - "Connected to: {{ inventory_hostname }} ({{ ansible_host }})"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: "{{ apt_cache_valid_time }}"
      register: apt_update
      retries: 3
      delay: 10
      until: apt_update is succeeded

    - name: Apply patches
      apt:
        upgrade: dist
        update_cache: no
        autoremove: yes
        autoclean: yes
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: upgrade_result
      retries: 2
      delay: 30
      until: upgrade_result is succeeded

    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Parse upgraded packages
      set_fact:
        patched_packages: >-
          {{
            (upgrade_result.stdout | default('') | regex_findall('Unpacking ([^\\s:]+)') | unique)
          }}

    - name: Store per-host patch result
      set_fact:
        patch_result:
          host: "{{ inventory_hostname }}"
          ip: "{{ ansible_host }}"
          changed: "{{ upgrade_result.changed | default(false) }}"
          package_count: "{{ patched_packages | length }}"
          packages: "{{ patched_packages }}"
          reboot_required: "{{ reboot_required.stat.exists | default(false) }}"

    - name: Reboot if required and allowed
      reboot:
        msg: "Reboot by Ansible patching"
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: uptime
      when:
        - reboot_required.stat.exists
        - reboot_allowed | bool

# Play 3: Summary
- name: Patching summary
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Build consolidated patch_results from hostvars
      set_fact:
        patch_results: >-
          {{
            (groups['ec2_vms'] | default([]))
            | map('extract', hostvars, 'patch_result')
            | select('defined')
            | list
          }}

    - name: Print per-host patch report
      debug:
        msg: >-
          [{{ item.host }}] ({{ item.ip }})
          | Patched: {{ item.changed }}
          | Packages: {{ item.package_count }}
          | Reboot required: {{ item.reboot_required }}
          | {{ item.packages | join(', ') if item.changed else 'No changes' }}
      loop: "{{ patch_results | default([]) }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Print overall summary
      debug:
        msg:
          - "========================================"
          - "         PATCH SUMMARY REPORT          "
          - "========================================"
          - "Environment  : {{ environment | default('unknown') }}"
          - "Patch type   : {{ patch_type_input | default('security') }}"
          - "Total VMs    : {{ patch_results | default([]) | length }}"
          - "VMs patched  : {{ patch_results | default([]) | selectattr('changed', 'equalto', true) | list | length }}"
          - "VMs unchanged: {{ patch_results | default([]) | selectattr('changed', 'equalto', false) | list | length }}"
          - "Reboots needed: {{ patch_results | default([]) | selectattr('reboot_required', 'equalto', true) | list | length }}"
          - "Total packages upgraded: {{ patch_results | default([]) | sum(attribute='package_count') }}"
          - "========================================"